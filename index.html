html{scroll-behavior:smooth;scroll-padding-top:70px}

a{color:inherit}

.bg{position:absolute;inset:-20%;background:

@keyframes glow{to{transform:scale(1.12) translate(2%,-2%)}}
.fl{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}

h2{font-size:clamp(34px,5vw,56px);margin-bottom:10px}
.lead{color:var(--mute);max-width:620px;margin:0 0 34px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}

.gate{display:none;position:absolute;inset:0;place-items:center;z-index:3}

.tl{list-style:none;margin:0;padding:8px 24px 26px 30px}

#pgrid,#countries{display:block}

@media(prefers-reduced-motion:reduce){.bg,.ring,.ball{animation:none}.words span{transition:none}html{scroll-behavior:auto}}

      var s=document.createElement("span");s.textContent=e[1];
      li.appendChild(y);li.appendChild(s);tl.appendChild(li);
    });
    dlg.showModal();dlg.scrollTop=0;
  });
  (OLD[p.n]?gB:gA).appendChild(b);
  b.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();b.click()}});
});
document.getElementById("pclose").addEventListener("click",function(){dlg.close()});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
// ---- Unlock ----
var wrap=document.getElementById("lockwrap"),KEY="fulltime_unlocked";
function lock(on){wrap.classList.toggle("locked",on)}
var ok=false;try{ok=localStorage.getItem(KEY)==="1"}catch(e){}
lock(!ok);
document.getElementById("go").addEventListener("click",function(){
  var v=document.getElementById("code").value.trim().toUpperCase();
  if(v===ACCESS_CODE){lock(false);try{localStorage.setItem(KEY,"1")}catch(e){}}
  else document.getElementById("err").textContent="That code isn’t right. Check it and try again.";
});
</script>
